# Builds an installable Android APK from the static game in docs/ (Capacitor WebView shell)
# and publishes it as a GitHub Release asset ("latest") plus a workflow artifact.
name: Android APK

on:
  push:
    branches: [main]
    paths: ["docs/**", "app/**", "capacitor.config.json", "package.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor and PeerJS
        run: npm install --no-audit --no-fund

      - name: Bundle PeerJS locally (no CDN needed for online play)
        run: |
          mkdir -p docs/vendor
          cp node_modules/peerjs/dist/peerjs.min.js docs/vendor/peerjs.min.js

      - name: Create Android project
        run: npx cap add android

      - name: Landscape, fullscreen, app icon
        run: |
          set -e
          MAN=android/app/src/main/AndroidManifest.xml
          # lock to landscape (either side), handle rotation/resize in the WebView
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' "$MAN"
          # immersive fullscreen activity
          cp app/native/MainActivity.java android/app/src/main/java/com/designerawei/infinitedream/MainActivity.java
          # launcher icons (pre-rendered from app/icon.png into app/res)
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in app/res/mipmap-*; do
            name=$(basename "$d")
            mkdir -p "android/app/src/main/res/$name"
            rm -f "android/app/src/main/res/$name/ic_launcher_foreground.png"
            cp "$d"/*.png "android/app/src/main/res/$name/"
          done
          grep -n "screenOrientation" "$MAN"

      - name: Sync web assets
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/ai-girls-dungeon.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ai-girls-dungeon-apk
          path: out/ai-girls-dungeon.apk

      - name: Publish release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AI娘·幻觉地牢 安卓版（最新构建）
          body: |
            手机下载 `ai-girls-dungeon.apk` 安装即可（需允许"安装未知来源应用"）。
            横屏全屏运行，存档保存在本机；联机与网页版互通（房间码相同）。
            构建自提交 ${{ github.sha }}
          files: out/ai-girls-dungeon.apk
          make_latest: true
